<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found for Ryne F. Shelton's personal website.">
  <meta name="theme-color" content="#f5f4ef">
  <title>Page Not Found | Ryne F. Shelton</title>
  <link rel="canonical" href="https://shelton-rf.github.io/404.html">
  <link rel="icon" type="image/png" href="./assets/images/rysys.png">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; }
    .not-found {
      width: min(720px, calc(100% - 32px));
      margin: 80px auto;
      padding: 40px 24px;
      background: #fffefa;
      border: 1px solid #d5d4cc;
      border-top: 4px solid #a24d3d;
      box-shadow: 0 12px 28px rgba(32, 43, 51, 0.06);
      text-align: center;
    }
    .not-found h1 {
      margin-bottom: 12px;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
    }
    .not-found p {
      color: #5c6666;
      font-size: 1.05rem;
    }
    .not-found a {
      display: inline-block;
      margin-top: 16px;
      color: #176b8a;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <p class="eyebrow">404 / NOT FOUND</p>
    <h1>That page moved.</h1>
    <p>The page you requested could not be found, but the homepage is still available.</p>
    <a href="./index.html">Return to the homepage →</a>
  </main>
</body>
</html>
